services:
  api:
    build:
      context: .
      additional_contexts:
        go-local: /home/star
    env_file:
      - .env
    environment:
      HTTP_ADDR: :8080
      SQLITE_PATH: /app/data/app.db
      MIGRATIONS_PATH: /app/migrations
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  web_node_modules: