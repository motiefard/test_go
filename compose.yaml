services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.github
    env_file:
      - .env
    environment:
      HTTP_ADDR: :8080
      SQLITE_PATH: /app/data/app.db
      MIGRATIONS_PATH: /app/migrations
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.github
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api